<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>テストページ</title>
<style>
    .sample_column {
        width: 80%;
        top: 100px;
        position: relative;
        margin: auto;
        display: flex;
        justify-content: space-between;
    }
    .sample_block1, .sample_block2 {
        width: 640px;
        height: 640px;
        box-sizing: border-box;
        color: white;
        text-align: center;
        align-content: center;
        border: 12px solid transparent;
        transition: color 1s, border-color 1s;
    }
    .sample_block1 {
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/insurance_1.webp");
        background-position: center;
        backdrop-filter: grayscale(100%);
    }
    .sample_block2 {
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/art_1.webp");
        background-position: center;
        backdrop-filter: grayscale(100%);
    }
    h2 {
        font-size: 48px;
    }
    h4 {
        font-size: 24px;
    }

    .sample_block1:hover {
        color: red;
        border-color: red;
    }
    .sample_block2:hover {
        color: blue;
        border-color: blue;
    }
</style>
</head>
<body>
<div class="sample_column">
    <div class="sample_block1">
        <h2>COMMUNICATION SUPPORT</h2>
        <h4>コミュニケーションサポート</h4>
    </div>
    <div class="sample_block2">
        <h2>ART PRINT</h2>
        <h4>美術印刷</h4>
    </div>
</div>
</body>
</html>
