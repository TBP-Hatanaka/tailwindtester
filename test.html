<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>テストページ</title>
<style>
    .sample_column {
        width: 80%;
        top: 100px;
        position: relative;
        margin: auto;
        display: flex;
        justify-content: space-between;
    }
    .sample_block1, .sample_block2 {
        width: 640px;
        height: 640px;
        box-sizing: border-box;
        color: white;
        text-align: center;
        align-content: center;
        border: 12px solid white;
        transition: color 1s, border-color 1s;
        position: relative;
    }
    .sample_block1 {
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/insurance_1.webp");
        background-position: center;
        background-color: black;
        background-blend-mode: luminosity;
        background-size: cover;

    }
    .sample_block2 {
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/art_1.webp");
        background-position: center;
        background-color: black;
        background-blend-mode: luminosity;
        background-size: cover;
    }
    .sample_block1::after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 12px solid red;
        pointer-events: none;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1s ease;
    }
    .sample_block2::after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 12px solid blue;
        pointer-events: none;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1s ease;
    }
    .sample_block1:hover::after,
    .sample_block2:hover::after {
        transform: scaleX(1);
    }
    .sample_block1 h2, .sample_block2 h2 {
        font-size: 48px;
        margin: 0;
        background-size: 200% 100%;
        background-position: 100% 0;
    }
    .sample_block1 h4, .sample_block2 h4 {
        font-size: 24px;
        margin: 0;
    }
    .sample_block1 h2, .sample_block1 h4 {
        font-size: 48px;
        margin: 0;
        background-size: 200% 100%;
        background-position: 100% 0;
        background: linear-gradient(
            to right,
            red 0%,
            red 50%,
            white 50%,
            white 100%
        );
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
        transition: background-position 1s ease;
    }
    .sample_block2 h2, .sample_block2 h4 {
        font-size: 24px;
        margin: 0;
        background-size: 200% 100%;
        background-position: 100% 0;
        background: linear-gradient(
            to right,
            blue 0%,
            blue 50%,
            white 50%,
            white 100%
        );
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
        transition: background-position 1s ease;
    }
    .sample_block1:hover h2,
    .sample_block1:hover h4,
    .sample_block2:hover h2,
    .sample_block2:hover h4, {
        background-position: 0 0;
    }
</style>
</head>
<body>
<div class="sample_column">
    <div class="sample_block1">
        <h2>COMMUNICATION SUPPORT</h2>
        <h4>コミュニケーションサポート</h4>
    </div>
    <div class="sample_block2">
        <h2>ART PRINT</h2>
        <h4>美術印刷</h4>
    </div>
</div>
</body>
</html>
