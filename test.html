<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>テストページ</title>
<style>
    .sample_column {
        width: 80%;
        top: 100px;
        position: relative;
        margin: auto;
        display: flex;
        justify-content: space-between;
    }
    .sample_block1, .sample_block2 {
        width: 640px;
        height: 640px;
        box-sizing: border-box;
        color: white;
        text-align: center;
        align-content: center;
        border: 12px solid white;
        transition: color 1s, border-color 1s;
        position: relative;
    }
    .sample_block1 {
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/insurance_1.webp");
        background-position: center;
        background-color: black;
        background-blend-mode: luminosity;
        background-size: cover;

    }
    .sample_block2 {
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/art_1.webp");
        background-position: center;
        background-color: black;
        background-blend-mode: luminosity;
        background-size: cover;
    }

    @property --border-progress {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 0%;
    }

    .sample_block1,
    .sample_block2 {
        --border-progress: 0%;
        --accent-color: red;
    }

    .sample_block2 {
        --accent-color: blue;
    }

    .sample_block1::after,
    .sample_block2::after {
        content: "";
        position: absolute;

        /* 元の白い枠線の上に重ねる */
        inset: -12px;
        padding: 12px;

        background: conic-gradient(
            from -45deg,
            var(--accent-color) 0%,
            var(--accent-color) var(--border-progress),
            transparent var(--border-progress),
            transparent 100%
        );

        /* 中央部分をくり抜き、枠線だけ表示する */
        mask:
            linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
        mask-composite: exclude;

        -webkit-mask:
            linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;

        pointer-events: none;
        transition: --border-progress 1s linear;
    }

    .sample_block1:hover::after,
    .sample_block2:hover::after {
        --border-progress: 100%;
    }
    .sample_block1 h2, .sample_block2 h2 {
        font-size: 48px;
        margin: 0;
        background-size: 200% 100%;
        background-position: 100% 0;
    }
    .sample_block1 h4, .sample_block2 h4 {
        font-size: 24px;
        margin: 0;
    }
    .sample_block1 h2,
    .sample_block1 h4,
    .sample_block2 h2,
    .sample_block2 h4 {
        margin: 0;

        background-image: linear-gradient(
            to right,
            var(--accent-color) 0%,
            var(--accent-color) 50%,
            white 50%,
            white 100%
        );
        background-size: 200% 100%;
        background-position: 100% 0;

        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;

        transition: background-position 1s ease;
    }

    .sample_block1:hover h2,
    .sample_block1:hover h4,
    .sample_block2:hover h2,
    .sample_block2:hover h4 {
        background-position: 0 0;
    }
    .sample_port {
        width: 100%;
        height: 100vh;
        top: 480px;
        position: relative;
        margin: auto;
        display: flex;
    }
    .sample_port1, .sample_port2 {
        width: 50%;
        height: 100%;
        box-sizing: border-box;
        color: white;
        text-align: center;
        align-content: center;
        position: relative;
        z-index: 1;
    }
    .sample_port1 {
        position: absolute;
        left: 0;
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/insurance_1.webp");
        background-position: center;
        background-color: black;
        background-blend-mode: luminosity;
        background-size: cover;
    }
    .sample_port2 {
        position: absolute;
        right: 0;
        background-image: url("https://www.toyobijutsu-prt.co.jp/wp-content/uploads/2024/09/art_1.webp");
        background-position: center;
        background-color: black;
        background-blend-mode: luminosity;
        background-size: cover;
    }
    .sample_port1:hover {
        width: 80%;
        z-index: 5;
    }
    .sample_port2:hover {
        width: 80%;
        z-index: 5;
    }
</style>
</head>
<body>
<div class="sample_column">
    <div class="sample_block1">
        <h2>COMMUNICATION SUPPORT</h2>
        <h4>コミュニケーションサポート</h4>
    </div>
    <div class="sample_block2">
        <h2>ART PRINT</h2>
        <h4>美術印刷</h4>
    </div>
</div>
<div class="sample_port">
    <div class="sample_port1">
        <h2>COMMUNICATION SUPPORT</h2>
        <h4>コミュニケーションサポート</h4>
    </div>
    <div class="sample_port2">
        <h2>ART PRINT</h2>
        <h4>美術印刷</h4>
    </div>
</div>
</body>
</html>
